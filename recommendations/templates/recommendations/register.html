
<!DOCTYPE html>
<html>
<head>
    <title>TravelWise - Register</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf3f7;
        }

        .box {
            max-width: 400px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 10px #0002;
        }

        h2 {
            color: #176b87;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #176b87;
            color: white;
            border: none;
            border-radius: 5px;
        }

        .errorlist {
            color: red;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Create TravelWise Account</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Register</button>
    </form>

    <p>
        Already registered?
        <a href="{% url 'login' %}">Login</a>
    </p>

</div>

</body>
</html>
